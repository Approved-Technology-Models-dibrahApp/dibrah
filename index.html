    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="dibrah App is an innovative product developed by Approved Technology Models Company, designed to empower SMEs to manage, track, and enhance customer relationships through tailored offers, loyalty programs, and direct supplier connections."
    />
    <meta name="theme-color" content="#f27468" />
    <meta property="og:title" content="dibrah - Empowering SMEs & Enriching Customer Experience" />
    <meta
      property="og:description"
      content="Empowering SMEs and enriching customer experience across Saudi Arabia."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />
    <meta property="og:image" content="/favicon.jpg" />
    <title>dibrah - Empowering SMEs &amp; Enriching Customer Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('dibrah-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme ? theme === 'dark' : prefersDark) {
            document.documentElement.classList.add('dark');
          }
          var lang = localStorage.getItem('dibrah-lang');
          if (lang === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
